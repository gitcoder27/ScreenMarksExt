<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SceneMarks</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="128x128" href="../../assets/icons/icon-128.png">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div>
          <h1>SceneMarks</h1>
          <p id="platformLabel">Checking page...</p>
        </div>
        <button id="refreshButton" class="retry-button" type="button" title="Look for the video again">Retry</button>
      </header>

      <section class="site-controls site-controls--compact" aria-label="Where SceneMarks runs">
        <div class="site-controls__row">
          <p><span id="siteStateLabel">On for</span> <strong id="siteDomainLabel"></strong></p>
          <div class="site-controls__buttons">
            <button id="siteToggleButton" type="button" hidden>Turn off here</button>
            <button id="pauseAllButton" type="button">Pause all</button>
          </div>
        </div>
      </section>

      <section class="site-controls voice-controls" aria-label="Voice commands">
        <div class="site-controls__row">
          <p><strong>Voice</strong> <span id="voiceStatusLabel">Off</span></p>
          <button id="voiceToggleButton" type="button">Turn on</button>
        </div>
        <p id="voiceDetailLabel" class="voice-controls__detail" hidden></p>
      </section>

      <section id="statusBox" class="status-box" role="status"></section>

      <section id="videoRow" class="video-row" hidden>
        <button id="videoFavoriteButton" class="favorite-toggle" type="button" hidden>&#9734;</button>
        <p id="videoTitleLabel" class="video-title"></p>
      </section>

      <section id="videoPanel" class="video-panel" hidden>
        <p class="video-clock"><span id="currentTimeLabel">--:--</span> <span class="video-clock__of">/ <span id="durationLabel">--:--</span></span></p>
        <div class="primary-actions">
          <button id="saveMomentButton" type="button">Save Moment</button>
          <button id="rangeButton" type="button">Mark Start</button>
          <button id="cancelRangeButton" class="secondary-action" type="button" hidden>Cancel range</button>
        </div>
      </section>

      <section class="scenes-section">
        <div class="section-heading">
          <h2>Saved times</h2>
          <span id="sceneCountLabel">0</span>
        </div>
        <div id="sceneList" class="scene-list"></div>
      </section>

      <footer class="popup-footer">
        <button id="toggleOverlayButton" type="button">Overlay</button>
        <button id="openLibraryButton" type="button">Library</button>
        <button id="openOptionsButton" type="button">Settings</button>
      </footer>
    </main>

    <dialog id="sceneDialog" class="scene-dialog">
      <form method="dialog" id="sceneForm">
        <h2 id="dialogTitle">Save Scene</h2>
        <p id="dialogTime" class="dialog-time"></p>
        <label>
          Note
          <textarea id="noteInput" rows="4" maxlength="1000"></textarea>
        </label>
        <label>
          Tags
          <input id="tagsInput" type="text" placeholder="funny, share">
        </label>
        <div class="dialog-actions">
          <button id="cancelDialogButton" value="cancel" type="button">Cancel</button>
          <button id="confirmDialogButton" value="default" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <script src="../shared/constants.js"></script>
    <script src="../shared/time.js"></script>
    <script src="../shared/ids.js"></script>
    <script src="../shared/schema.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
    <script src="popup-voice.js"></script>
  </body>
</html>
