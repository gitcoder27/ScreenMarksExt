<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SceneMarks Library</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="128x128" href="../../assets/icons/icon-128.png">
    <link rel="stylesheet" href="library.css">
  </head>
  <body>
    <main class="library-shell">
      <header class="library-header">
        <div>
          <p class="eyebrow">SceneMarks</p>
          <h1>Library</h1>
        </div>
        <button id="openOptionsButton" type="button">Settings</button>
      </header>

      <section class="toolbar" aria-label="Library filters">
        <input id="searchInput" type="search" placeholder="Search title, note, or tag" aria-label="Search title, note, or tag">
        <select id="platformFilter" aria-label="Filter by platform"></select>
        <select id="sortSelect" aria-label="Sort videos" title="Sort videos">
          <option value="recent">Recently saved</option>
          <option value="added">Date added</option>
          <option value="scenes">Most scenes</option>
          <option value="title">Title</option>
          <option value="platform">Platform</option>
        </select>
        <label class="favorite-filter" title="Favorite videos: starred videos with all their timestamps. Favorite moments: only starred timestamps, in any video.">
          <span class="favorite-filter__star" aria-hidden="true">&#9733;</span>
          <select id="favoritesFilter" aria-label="Favorites">
            <option value="all">All</option>
            <option value="videos">Favorite videos</option>
            <option value="moments">Favorite moments</option>
          </select>
        </label>
        <div class="toolbar-actions" aria-label="Library expansion controls">
          <button id="playQueueButton" type="button" title="Play the scenes shown, one after another in one tab. Alt+Shift+K / Alt+Shift+J step through them.">Play These</button>
          <label class="shuffle-toggle" title="Play the scenes in random order">
            <input id="playQueueShuffle" type="checkbox">
            <span>Shuffle</span>
          </label>
          <button id="randomVideoButton" type="button" title="Pick a random video (R)">Random</button>
          <input id="randomOpenCount" type="number" min="1" step="1" value="5" title="How many random videos to open" aria-label="Number of random videos to open">
          <button id="openRandomVideosButton" type="button" title="Open that many random videos in new tabs">Open Random</button>
          <button id="expandAllButton" type="button">Expand All</button>
          <button id="collapseAllButton" type="button">Collapse All</button>
        </div>
      </section>

      <div class="summary-row">
        <p id="summaryBox" class="summary-box"></p>
        <p id="statusLine" class="status-line" role="status" aria-live="polite"></p>
      </div>
      <section id="libraryList" class="library-list" aria-label="Saved videos"></section>
      <p id="emptyState" class="empty-state" hidden></p>
      <button id="showMoreButton" class="show-more-button" type="button" hidden></button>

      <footer class="library-footer">
        <button id="exportButton" type="button">Export JSON</button>
        <label class="import-button">
          Import JSON
          <input id="importInput" type="file" accept="application/json,.json">
        </label>
      </footer>
    </main>

    <div id="rowMenu" class="row-menu" role="menu" aria-label="Timestamp actions" hidden>
      <button id="rowMenuEdit" type="button" role="menuitem">Edit note and tags</button>
      <button id="rowMenuDelete" type="button" role="menuitem">Delete timestamp</button>
    </div>

    <dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmDialogTitle">
      <h2 id="confirmDialogTitle"></h2>
      <p id="confirmDialogDescription" class="confirm-dialog__description"></p>
      <div class="dialog-actions">
        <button id="confirmCancelButton" type="button">Cancel</button>
        <button id="confirmDeleteButton" type="button">Delete</button>
      </div>
    </dialog>

    <script src="../shared/constants.js"></script>
    <script src="../shared/time.js"></script>
    <script src="../shared/ids.js"></script>
    <script src="../shared/schema.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="library.js"></script>
  </body>
</html>
