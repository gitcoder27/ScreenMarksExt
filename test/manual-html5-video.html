<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SceneMarks Manual HTML5 Video Test</title>
    <style>
      body {
        background: #f3f4f6;
        color: #111827;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px;
      }

      main {
        margin: 0 auto;
        max-width: 920px;
      }

      video {
        background: #111827;
        border-radius: 8px;
        display: block;
        margin-top: 16px;
        max-width: 100%;
        width: 920px;
      }

      input {
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SceneMarks Manual HTML5 Video Test</h1>
      <p>Select a local video file, start playback, then open the SceneMarks extension popup.</p>
      <input id="fileInput" type="file" accept="video/*">
      <video id="player" controls></video>
    </main>

    <script>
      const fileInput = document.getElementById("fileInput");
      const player = document.getElementById("player");
      let currentObjectUrl = null;

      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) {
          return;
        }

        if (currentObjectUrl) {
          URL.revokeObjectURL(currentObjectUrl);
        }

        currentObjectUrl = URL.createObjectURL(file);
        player.src = currentObjectUrl;
        player.load();
      });
    </script>
  </body>
</html>
